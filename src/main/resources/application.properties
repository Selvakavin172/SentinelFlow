# ============================================================
# Sentinel AML Application Configuration
# ============================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/sentinel
spring.application.name=SentinelFlow

# ============================================================
# DATABASE CONFIGURATION
# ============================================================
# Update these values to match your PostgreSQL setup
spring.datasource.url=jdbc:postgresql://localhost:5433/AzentioHackthon
spring.datasource.username=postgres
spring.datasource.password=Sony@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA/Hibernate Configuration
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=20

spring.jpa.properties.hibernate.order_inserts=true

spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.sentinelflow=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.jpa=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/sentinel-aml.log
logging.file.max-size=10MB
logging.file.max-history=10

# ============================================================
# SWAGGER/OPENAPI DOCUMENTATION
# ============================================================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.default-models-expand-depth=1

# ============================================================
# APPLICATION FEATURES
# ============================================================
# AML Detection Rules Configuration
aml.detection.enabled=true
aml.structuring.threshold.min-amount=9000
aml.structuring.threshold.max-amount=9999
aml.structuring.time-window-hours=24
aml.structuring.min-transactions=3
aml.rapid-movement.threshold-percentage=80
aml.rapid-movement.time-window-hours=48
aml.behavioral-deviation.baseline-days=90
aml.behavioral-deviation.multiplier=3
aml.ctr.threshold=10000

# ============================================================
# ACTUATOR CONFIGURATION (for monitoring)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.simple.enabled=true


# ============================================================
# VALIDATION CONFIGURATION
# ============================================================
spring.validation.enabled=true

# ============================================================
# TRANSACTION CONFIGURATION
# ============================================================
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.open-in-view=false
server.port=8082
